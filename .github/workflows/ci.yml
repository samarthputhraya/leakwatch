name: ci

on:
  push:
  pull_request:

# The job only reads the repository.
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Actions pinned to a commit (the tag in the comment), all on Node 24.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Java 17 for the Spark unit tests
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          enable-cache: true

      - name: Install Python 3.11 and pinned dependencies (all extras, CPU-only torch)
        run: |
          uv python install 3.11
          uv sync --locked --all-extras

      - name: Lint
        run: |
          uv run --locked --all-extras ruff check src tests scripts notebooks
          uv run --locked --all-extras ruff format --check src tests scripts notebooks

      - name: Unit + contract tests
        # Tests that need the BattLeDIM download or the built lake skip automatically in CI;
        # slow and integration (Kafka) tests are excluded here and run locally.
        run: uv run --locked --all-extras pytest -m "not slow and not integration" --cov --cov-report=term
