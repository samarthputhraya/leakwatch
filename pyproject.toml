[project]
name = "leakwatch"
version = "0.1.0"
description = "Software-only leak detection, localization and operator copilot for water networks (BattLeDIM L-Town)."
readme = "README.md"
requires-python = "==3.11.*"
# Direct dependencies are pinned exactly; uv.lock pins the full tree. See docs/DECISIONS.md D-004, D-006.
dependencies = [
    "epyt-flow==0.17.3",
    "matplotlib==3.11.2",
    "networkx==3.6.1",
    "numpy==1.26.4",
    "openpyxl==3.1.5",
    "pandas==2.2.3",
    "pandera==0.36.0",
    "psutil==7.2.2",
    "pyarrow==25.0.0",
    "pydantic==2.14.3",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "scipy==1.17.1",
    "setuptools==80.9.0",
    "six==1.17.0",
    "tqdm==4.70.1",
    "wntr==1.3.2",
]

[dependency-groups]
dev = [
    "ipykernel==7.4.0",
    "nbclient==0.11.0",
    "nbformat==5.11.1",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leakwatch"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "T20", "D"]
ignore = ["D100", "D104", "D105", "D107", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "T20"]
"scripts/**" = ["T20"]
# Notebooks print results and end cells with a bare expression to display it.
"notebooks/**" = ["T20", "D", "E402", "B018", "N816"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running tests (simulation, full-year data); skipped in CI",
    "needs_data: requires `make data` to have run",
    "integration: requires Docker services (`make up`)",
]

[tool.coverage.run]
source = ["src/leakwatch"]
omit = ["src/leakwatch/dashboard/*"]
