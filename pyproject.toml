[project]
name = "leakwatch"
version = "0.1.0"
description = "Software-only leak detection, localization and operator copilot for water networks (BattLeDIM L-Town)."
readme = "README.md"
requires-python = "==3.11.*"
# Direct dependencies are pinned exactly; uv.lock pins the full tree. See docs/DECISIONS.md D-004, D-006.
dependencies = [
    "confluent-kafka==2.16.2",
    "duckdb==1.5.6",
    "epyt-flow==0.17.3",
    "matplotlib==3.11.2",
    "networkx==3.6.1",
    "numpy==1.26.4",
    "openpyxl==3.1.5",
    "orjson==3.13.0",
    "pandas==2.2.3",
    "pandera==0.36.0",
    "psutil==7.2.2",
    "pyarrow==25.0.0",
    "pydantic==2.14.3",
    "pyspark==3.5.9",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "scipy==1.17.1",
    "setuptools==80.9.0",
    "six==1.17.0",
    "tqdm==4.70.1",
    "wntr==1.3.2",
]

[project.optional-dependencies]
# Heavy stacks, installed locally by `make setup` (uv sync --all-extras); CI uses the base set and
# the tests that need these skip (docs/DECISIONS.md D-004, D-019). Torch comes from the CPU index.
dl = ["torch==2.7.1", "torch-geometric==2.6.1"]
copilot = [
    "torch==2.7.1",
    "openai==1.109.1",
    "sentence-transformers==3.4.1",
    "pypdf==5.9.0",
    "sqlglot==26.33.0",
    # OCR for scanned manuals (docs/DECISIONS.md D-034): render pages, RapidOCR on ONNX Runtime.
    "pypdfium2==4.30.0",
    "rapidocr-onnxruntime==1.4.4",
    "opencv-python-headless==4.10.0.84",
]
dashboard = ["streamlit==1.45.1", "plotly==5.24.1"]

[dependency-groups]
dev = [
    "hypothesis==6.170.17",
    "ipykernel==7.4.0",
    "mutmut==3.8.1",
    "nbclient==0.11.0",
    "nbformat==5.11.1",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leakwatch"]

[tool.uv]
default-groups = ["dev"]
# rapidocr-onnxruntime asks for the GUI build of OpenCV, which needs libGL at import time;
# the headless build above provides the same `cv2` module without it.
exclude-dependencies = ["opencv-python"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "T20", "D"]
# N812: `from pyspark.sql import functions as F` is the PySpark convention.
ignore = ["D100", "D104", "D105", "D107", "N812", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "T20"]
"scripts/**" = ["T20"]
# Notebooks print results and end cells with a bare expression to display it.
"notebooks/**" = ["T20", "D", "E402", "B018", "N816"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running tests (simulation, full-year data); skipped in CI",
    "needs_data: requires `make data` to have run",
    "needs_lake: requires the 2018 raw lake (`make ingest-year YEAR=2018`)",
    "needs_features: requires the batch feature tables and baselines (`make features`)",
    "spark: starts a local SparkSession (needs Java 17)",
    "integration: requires Docker services (`make up`)",
]

[tool.coverage.run]
source = ["src/leakwatch"]
omit = ["src/leakwatch/dashboard/*"]

[tool.mutmut]
# `make mutation` (D-040): mutation testing of the core logic modules with the unit tests.
source_paths = ["src/"]
only_mutate = [
    "src/leakwatch/eval/battledim_score.py",
    "src/leakwatch/features/rebaseline.py",
    "src/leakwatch/copilot/sql_guard.py",
    "src/leakwatch/copilot/guardrails.py",
    "src/leakwatch/eval/detection.py",
    "src/leakwatch/bdt/alerts.py",
]
pytest_add_cli_args_test_selection = ["tests/unit/", "-m", "not slow and not spark"]
pytest_add_cli_args = ["-p", "no:warnings", "-q", "-p", "no:cacheprovider"]
do_not_mutate_patterns = ['log\.\w+\(', 'raise \w+', '"""']
