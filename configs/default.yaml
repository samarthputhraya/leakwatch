# LeakWatch default configuration — laptop-safe (8 GB RAM, no GPU).
# Overlay a second file with LEAKWATCH_CONFIG=configs/full.yaml, or override one key with
# LEAKWATCH__SECTION__KEY=value (value parsed as YAML). See src/leakwatch/common/config.py.

project:
  seed: 42
  display_timezone: Asia/Kolkata   # internal timestamps are UTC; this is for UI only

battledim:
  years: [2018, 2019]
  download_optional: false         # true also fetches L-TOWN_Real.inp (177 MB, not used by the pipeline)
  download_retries: 5              # Zenodo often answers 502 / read timeouts; retried with backoff
  download_timeout_s: 120

cleaning:
  # PRD §7.2, applied by leakwatch.features.clean (cleaned layer + features, batch and stream)
  step_seconds: 300                # BattLeDIM / simulator sampling interval (5 minutes)
  max_ffill_gap_steps: 2           # interior gaps of 1-2 missing steps get the last value
  stuck_min_steps: 12              # flag a reading once its value has not changed for 12 steps
  stuck_exempt_types: [flow, level, amr]   # constant values are normal operation there (D-016)

normal:
  # D-015: which timestamps count as "normal" (hour-of-week baselines now, K-Means training in P3)
  baseline_year: 2018
  background_max_peak_m3h: 10.0    # leaks that never exceed this are background leakage
  onset_exclusion_days: 7          # every leak's first days are excluded (= PRD §7.4 horizon)

features:
  # PRD §7.2: one feature vector per 1 h window, sliding every 15 min
  window_minutes: 60
  slide_minutes: 15
  stats: [mean, std, min, max, slope, residual]
  sensor_types: [pressure, flow, level]   # one series per sensor; AMRs enter as a sum per area
  exclude_out_of_range: true        # flagged values do not enter stats or AMR sums
  stream:
    lateness_minutes: 15            # emit a window once data 15 min past its last step has arrived
    trigger_seconds: 5
    max_offsets_per_trigger: 200000
    starting_offsets: earliest
    stop_when_idle_s: 60

kafka:
  bootstrap_servers: localhost:9092
  topics:                          # created by `make up` (leakwatch.ingest.topics)
    readings: {name: scada.readings, partitions: 6, retention_hours: 168}
    alerts: {name: alerts, partitions: 1, retention_hours: 720}
    demo_commands: {name: demo.commands, partitions: 1, retention_hours: 24}
  producer:
    linger_ms: 20
    batch_size_bytes: 1048576
    compression: lz4
    acks: all
    enable_idempotence: true       # broker drops producer retries -> no duplicate readings

replay:
  speed: max                       # simulated seconds per wall second, e.g. 60, 360; "max" = no pacing
  progress_every_steps: 8640       # log once per simulated month (30 days x 288 steps)

spark:
  master: local[4]
  driver_memory: 2g
  shuffle_partitions: 8            # also the number of state-store partitions (fixed per checkpoint)
  kafka_package: org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.9   # must match pyspark version
  ui_enabled: true                 # http://localhost:4040 while a job runs
  log_level: WARN

stream:
  raw:
    trigger_seconds: 5
    max_offsets_per_trigger: 200000  # 300k gave p95 13 s per catch-up batch (target <= 10 s)
    starting_offsets: earliest
    watermark: 1 hour              # event-time tolerance for late / duplicate readings
    stop_when_idle_s: 60           # batch-style runs stop after this long without new data
  ranges:                          # PRD §7.2 out-of-range flags; readings are kept and flagged
    pressure: [0.0, 100.0]         # m
    flow: [0.0, 1000.0]            # m3/h
    level: [0.0, 10.0]             # m
    amr: [0.0, 100000.0]           # L/h

network:
  # Zones you get by cutting L-Town at its pump and PRVs are named by one node inside each
  # (verified in tests: A has 29 pressure sensors, B is the zone behind PRV-3, C holds tank T1 + AMRs).
  area_anchors: {A: n54, B: n215, C: T1}

sim:
  # Phase 0 speed benchmark (`make sim-bench`): one leak, simulated with each engine.
  bench:
    durations_hours: [48, 168]       # PRD §4.2: one 48-hour and one 7-day scenario
    hydraulic_timestep_s: 300        # 5 minutes, same as BattLeDIM SCADA
    leak_pipe: p461                  # a 2018 benchmark leak pipe in Area A
    leak_diameter_m: 0.015           # BattLeDIM leak diameters range 0.0088–0.0229 m
    leak_start_hour: 12
    discharge_coeff: 0.75            # WNTR default orifice coefficient (PRD §4.2)
    engines: [wntr, epyt_flow]
    repeats: 1
