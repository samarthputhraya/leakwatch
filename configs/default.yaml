# LeakWatch default configuration — laptop-safe (8 GB RAM, no GPU).
# Overlay a second file with LEAKWATCH_CONFIG=configs/full.yaml, or override one key with
# LEAKWATCH__SECTION__KEY=value (value parsed as YAML). See src/leakwatch/common/config.py.

project:
  seed: 42
  display_timezone: Asia/Kolkata   # internal timestamps are UTC; this is for UI only

battledim:
  years: [2018, 2019]
  download_optional: false         # true also fetches L-TOWN_Real.inp (177 MB, not used by the pipeline)
  download_retries: 5              # Zenodo often answers 502 / read timeouts; retried with backoff
  download_timeout_s: 120

cleaning:
  # PRD §7.2, applied by leakwatch.features.clean (cleaned layer + features, batch and stream)
  step_seconds: 300                # BattLeDIM / simulator sampling interval (5 minutes)
  max_ffill_gap_steps: 2           # interior gaps of 1-2 missing steps get the last value
  stuck_min_steps: 12              # flag a reading once its value has not changed for 12 steps
  stuck_exempt_types: [flow, level, amr]   # constant values are normal operation there (D-016)

normal:
  # D-015: which timestamps count as "normal" (hour-of-week baselines now, K-Means training in P3)
  baseline_year: 2018
  background_max_peak_m3h: 10.0    # leaks that never exceed this are background leakage
  onset_exclusion_days: 7          # every leak's first days are excluded (= PRD §7.4 horizon)

features:
  # PRD §7.2: one feature vector per 1 h window, sliding every 15 min
  window_minutes: 60
  slide_minutes: 15
  stats: [mean, std, min, max, slope, residual]
  rebaseline:                      # D-038: residual minus its own median of the previous week
    window_days: 7                 # chosen on 2018 (official rules applied to 2018), never 2019
    gap_days: 1                    # a new leak stays visible for >= 1 day + half the window
  sensor_types: [pressure, flow, level]   # one series per sensor; AMRs enter as a sum per area
  exclude_out_of_range: true        # flagged values do not enter stats or AMR sums
  stream:
    lateness_minutes: 15            # emit a window once data 15 min past its last step has arrived
    trigger_seconds: 5
    max_offsets_per_trigger: 200000
    starting_offsets: earliest
    stop_when_idle_s: 60

kafka:
  bootstrap_servers: localhost:9092
  topics:                          # created by `make up` (leakwatch.ingest.topics)
    readings: {name: scada.readings, partitions: 6, retention_hours: 168}
    alerts: {name: alerts, partitions: 1, retention_hours: 720}
    demo_commands: {name: demo.commands, partitions: 1, retention_hours: 24}
  producer:
    linger_ms: 20
    batch_size_bytes: 1048576
    compression: lz4
    acks: all
    enable_idempotence: true       # broker drops producer retries -> no duplicate readings

replay:
  speed: max                       # simulated seconds per wall second, e.g. 60, 360; "max" = no pacing
  progress_every_steps: 8640       # log once per simulated month (30 days x 288 steps)

spark:
  master: local[4]
  driver_memory: 2g
  shuffle_partitions: 8            # also the number of state-store partitions (fixed per checkpoint)
  kafka_package: org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.9   # must match pyspark version
  ui_enabled: true                 # http://localhost:4040 while a job runs
  log_level: WARN

stream:
  raw:
    trigger_seconds: 5
    max_offsets_per_trigger: 200000  # 300k gave p95 13 s per catch-up batch (target <= 10 s)
    starting_offsets: earliest
    watermark: 1 hour              # event-time tolerance for late / duplicate readings
    stop_when_idle_s: 60           # batch-style runs stop after this long without new data
  ranges:                          # PRD §7.2 out-of-range flags; readings are kept and flagged
    pressure: [0.0, 100.0]         # m
    flow: [0.0, 1000.0]            # m3/h
    level: [0.0, 10.0]             # m
    amr: [0.0, 100000.0]           # L/h

bdt:
  # PRD §7.3–7.4: K-Means anomaly detection on the 1 h feature windows (Phase 3)
  model: kmeans
  # Model used for live alerts and the lake's batch alerts: the residual-feature variant, chosen on
  # 2018 validation leak onsets (D-020); `kmeans` is the PRD §7.2 all-feature baseline.
  live_model: kmeans_residual_ci   # D-030: chosen on simulated leaks on normal 2018 (bdt-synthetic)
  train_year: 2018
  eval_year: 2019
  # Time-blocked split of normal 2018 windows (overlapping windows: never split at random):
  # day index mod split_cycle_days -> train days, threshold day (tau), validation day (tuning m).
  split_cycle_days: 5
  threshold_day: 3
  validation_day: 4
  pca_variance: 0.95               # keep PCA components explaining this share of variance
  k_min: 2
  k_max: 20
  max_iter: 100
  kmeans_init_steps: 5
  threshold_quantile: 0.99         # tau = this quantile of held-out normal scores
  persistence_windows: 3           # m: alert after m consecutive windows above tau (tuned on 2018)
  persistence_candidates: [1, 2, 3, 4, 6, 8, 12, 16, 24, 32, 48]   # 48 windows = 12 h
  max_false_alarms_per_week: 2.0   # PRD §10 aim; constraint when tuning m on 2018
  close_after_windows: 4           # an alert closes after 4 windows (1 h) back below tau
  detection_horizon_days: 7        # PRD §7.4: alert within [leak start, start + 7 days]
  top_sensors: 3
  inflow_series: [flow__p227, flow__p235]   # reservoir inlets; PUMP_1 moves water inside the net
  synthetic:                       # `make bdt-synthetic` (D-030): simulated leaks on normal 2018
    background: ["2018-11-08", "2018-12-31"]   # normal under D-015 (Finding 9)
    junctions: 60
    diameters_m: [0.01, 0.02, 0.03]
    starts: 10                     # random leak start times (junctions are spread over them)
    hours: 6

dl:
  # PRD §8 (Phase 5). CPU-only; laptop-safe defaults.
  lstm:
    seq_steps: 72                  # 6 h of 5-minute residuals (PRD §8.1)
    hidden: 64
    latent: 16
    epochs: 30                     # 15 stopped with the threshold-day loss still falling
    patience: 3                    # early stopping on threshold-day loss
    batch_size: 256
    learning_rate: 0.001
    threads: 6
  comparison:
    # Detector comparison at matched false-alarm rates (PRD §8.1): every detector is swept over
    # the same threshold levels (quantiles of its own 2018 threshold-day scores, then multiples
    # of their maximum) at its own 2018-tuned m, and compared at each false-alarm budget.
    quantiles: [0.5, 0.7, 0.8, 0.9, 0.95, 0.97, 0.98, 0.99, 0.995, 0.998, 0.999]
    max_multiples: [1.25, 1.5, 2.0, 3.0, 5.0]
    fa_budgets_per_week: [0.5, 1.0, 2.0, 4.0]
    chance_iterations: 200
  gnn_data:
    scenarios: 500                 # PRD default small config; configs/full.yaml: 5000
    workers: 4
    step_s: 300
    leak_diameter_m: [0.005, 0.03]  # log-uniform: small to large leaks
    start_hours: [0, 3, 6, 9, 12, 15, 18, 21]   # time of day the leak starts
    reference_runs: 3              # leak-free runs per world and start time (median = reference)
    # D-038: scenarios on perturbed copies of the network, like the real one in 2019
    worlds: 120                    # perturbed networks; each scenario runs on one of them
    roughness_noise: 0.10          # every pipe's H-W roughness x U(0.9, 1.1) per world
    background_leaks: [0, 6]       # small leaks already running in a world (reference and leak run)
    background_diameter_m: [0.003, 0.010]
    day_demand_noise: 0.05         # whole-network demand factor N(1, 0.05) per run
    sensitivity_diameter_m: 0.015  # sensitivity matrix: one leak per junction, nominal model
    sensitivity_start_hours: [3, 15]
    demand_noise: 0.10
    sensor_noise_m: 0.02
    discharge_coeff: 0.75
  gnn:
    hidden: 64
    layers: 3
    heads: 4
    epochs: 60
    patience: 8
    batch_size: 32
    learning_rate: 0.003
    weight_decay: 0.0001
    unseen_diameter_m: [0.014, 0.017]  # held out of training: "unseen leak sizes" (PRD §8.2)
    size_buckets_m: [0.010, 0.020]     # small < 10 mm <= medium < 20 mm <= large
    within_m: 300
    threads: 12                        # torch CPU threads while training
    sensor_distance_scale_m: 500       # node feature exp(-pipe distance to each sensor / this)
    live_refine_hours: 2               # live: re-localize an open alert during its first 2 h (D-033)
    # D-029, D-038; the MLP baseline is always trained. The earlier closeness/context ablation
    # (no closeness, local-only first design) is in D-029; this run ablates the sensitivity input.
    variants:
      gcn: {kind: gcn, closeness: true, context: true}
      gcn_sens: {kind: gcn, closeness: true, context: true, sensitivity: true}
      gat_sens: {kind: gat, closeness: true, context: true, sensitivity: true}
      gcn_sens_no_context: {kind: gcn, closeness: true, context: false, sensitivity: true}

demo:
  # PRD §16 live demo (Phase 7): BattLeDIM background + simulated leak signatures (D-025).
  topic: demo.readings
  partitions: 3
  shuffle_partitions: 2            # small micro-batches: fewer shuffle tasks = lower latency
  trigger_seconds: 2
  speed: 720                       # simulated seconds per wall second (1 h of data = 5 s)
  background_start: "2018-11-19 00:00"   # Monday; no batch alert of the live model Nov 18 - Dec 6 2018 (D-025)
  background_hours: 168
  signature_hours: 6               # EPANET leak-minus-no-leak deltas; held constant afterwards
  leak_diameter_m: 0.03            # default demo leak (~30 m3/h at L-Town pressures)
  check_nodes: [n100, n300, n470]  # junctions `make demo-check` injects at (areas A)
  quiet_before_inject_s: 10

battledim_score:
  # Official BattLeDIM 2020 scoring (KIOS-Research/BattLeDIM Scoring_Algorithm.m; D-037). These are
  # the competition's fixed parameters, not tunables: changing them breaks leaderboard comparison.
  max_distance_m: 300.0            # SP.xmax: pipe distance from the leak for a true positive
  cost_water_eur_m3: 0.80          # SP.costWater
  cost_crew_eur: 500.0             # SP.costCrew: a false positive costs this much

network:
  # Zones you get by cutting L-Town at its pump and PRVs are named by one node inside each
  # (verified in tests: A has 29 pressure sensors, B is the zone behind PRV-3, C holds tank T1 + AMRs).
  area_anchors: {A: n54, B: n215, C: T1}

sim:
  # Phase 4 scaling data (PRD §4.2, §7.5): consecutive simulated scenarios, Spark-parallel.
  # Laptop-safe default: 4 x 7 days = 1.4M readings. configs/full.yaml: 313 scenarios (75.1M,
  # i.e. 100M+ readings in the lake together with BattLeDIM 2018-2019). 7-day scenarios: a 30-day
  # epyt-flow run needs ~1 GB per worker and thrashed this 7.6 GB machine (D-023).
  scale:
    start: "2020-01-06"            # Monday after BattLeDIM 2019 ends: event time keeps moving forward
    scenario_days: 7
    scenarios: 4
    workers: 6                     # Spark tasks in parallel (one epyt-flow process each, ~0.4 GB)
    leaks_per_scenario: [0, 2]
    leak_diameter_m: [0.008, 0.025]   # BattLeDIM leak diameters span 0.0088-0.0229 m
    incipient_share: 0.5
    demand_uncertainty: 0.10       # demand patterns x U(0.9, 1.1)
    noise: {pressure_m: 0.02, level_m: 0.005, flow_rel: 0.01, amr_rel: 0.02}
  # Phase 0 speed benchmark (`make sim-bench`): one leak, simulated with each engine.
  bench:
    durations_hours: [48, 168]       # PRD §4.2: one 48-hour and one 7-day scenario
    hydraulic_timestep_s: 300        # 5 minutes, same as BattLeDIM SCADA
    leak_pipe: p461                  # a 2018 benchmark leak pipe in Area A
    leak_diameter_m: 0.015           # BattLeDIM leak diameters range 0.0088–0.0229 m
    leak_start_hour: 12
    discharge_coeff: 0.75            # WNTR default orifice coefficient (PRD §4.2)
    engines: [wntr, epyt_flow]
    repeats: 1

copilot:
  # PRD §9 (Phase 6). The endpoint comes from .env: LLM_BASE_URL, LLM_API_KEY, LLM_MODEL
  # (any OpenAI-compatible server). Without them: template work orders and rule-based complaints only.
  prompt_version: v3               # v1 zero-shot · v2 few-shot · v3 few-shot + schema + self-correction + guardrails
  clock: null                      # "now" for the data world (ISO UTC); null = end of the feature tables
  llm:
    temperature: 0.0
    max_tokens: 1200
    timeout_s: 60
    max_retries: 2                 # openai client retries (connection errors, 429, 5xx) with backoff
    seed: null                     # some OpenAI-compatible servers reject `seed`; set an int if yours accepts it
    # Free, rate-limited endpoints (D-035). LLM_RPM in .env overrides requests_per_minute.
    requests_per_minute: null      # pace requests to stay under the provider's limit; null = no pacing
    rate_limit_retries: 2          # extra waits after a 429 (Retry-After, else 5 s doubling)
    rate_limit_max_wait_s: 60      # longest single wait
    eval_rate_limit_retries: 6     # `make pe-eval` waits longer; then it stops and resumes on rerun
  agent:
    max_tool_rounds: 6             # LLM -> tools -> LLM rounds per answer before a final answer is forced
    max_correction_rounds: 3       # tool rounds allowed when an answer is regenerated by a guardrail
    max_tool_output_chars: 12000   # tool result text sent back to the model (truncated beyond this)
    history_messages: 12           # earlier chat messages kept in the prompt
    connection_ttl_s: 60           # rebuild the DuckDB views after this long (new alerts become visible)
  sql:
    max_rows: 1000                 # LIMIT enforced on every run_sql query
    timeout_s: 20
    max_query_chars: 8000
    memory_limit: 1GB              # DuckDB limits for copilot queries (laptop-safe)
    threads: 2
  alerts:
    list_default: 20
    list_max: 100
    id_prefix_min_chars: 8         # get_alert accepts a unique id prefix this long
  series:
    max_points: 600                # chart points; longer ranges are averaged into buckets
    sample_points: 24              # evenly spaced points sent to the model (the chart gets all)
    default_hours: 48              # range when no start/end is given (ending at the data clock)
    max_days: 31
    alert_margin_hours: 24         # around_alert_id: this much before the alert and after its end
  guardrails:
    trivial_numbers: [0, 1]        # never need a tool source
    max_regenerations: 1           # PRD §9.4: regenerate once, then answer from the tool output
  complaints:
    match_window_hours: 24         # alert active within this many hours of the complaint
    use_llm_extraction: true       # LLM fills {area, issue_type, onset}; rules are the fallback
    morning_hour: 6                # "since this morning" (UTC)
    afternoon_hour: 12
    evening_hour: 18
    night_hour: 22                 # "since last night" = previous day at this hour
  dispatch:
    demo_safe_mode: true           # LLM failure -> work order from the same tool outputs, "template fallback"
    max_pipes: 10
    pipes_per_sensor: 4            # no GNN candidates: nearest pipes to each top sensor, in sensor order
    max_per_run: 500
    manual_query: how to locate and confirm a leak before excavation
    manual_citations: 2
    priority:                      # PRD §9.3 P1/P2/P3 (thresholds are operator policy, not results)
      p1_loss_m3h: 10.0            # D-015 separates background leaks (<= 10 m3/h) from significant ones
      p2_loss_m3h: 3.0
      p1_score_ratio: 3.0          # kmeans_score_max / threshold
      p2_score_ratio: 1.5
  rag:
    embedding_model: sentence-transformers/all-MiniLM-L6-v2
    index_name: manuals            # data/index/manuals/{embeddings.npy, chunks.jsonl, meta.json}
    kb_dir: docs/kb                # our own Markdown documents (repo-relative)
    chunk_max_chars: 1000
    chunk_overlap_chars: 150
    top_k: 4
    min_score: 0.25                # cosine similarity below this is "not covered"
    passage_chars: 700             # passage text returned to the model
    embed_batch_size: 32
    download_timeout_s: 300
    documents:                     # PDFs in data/docs/ (PRD §4.3). Missing files are skipped with a warning.
      - id: cpheeo_om_2005
        file: cpheeo_om_water_supply_2005.pdf
        title: CPHEEO Manual on Operation and Maintenance of Water Supply Systems (2005)
        short: CPHEEO O&M Manual 2005
        # India Water Portal copy of the public MoUD/CPHEEO manual (cpheeo.gov.in timed out from here).
        url: https://prod-qt-images.s3.amazonaws.com/indiawaterportal/import/sites/default/files/iwp2/Manual__Operation_and_maintenance_of_water_supply_systems_CPHEEO_MoUD_2005.pdf
        sha256: 8922971ad2a6e1b703427608988f39e5acaf67aedb035bae9b4c48363075a098
      - id: cpheeo_ws_manual
        file: cpheeo_water_supply_treatment_1999.pdf
        title: CPHEEO Manual on Water Supply and Treatment (1999)
        short: CPHEEO Water Supply Manual 1999
        # Third edition (May 1999), the edition cpheeo.gov.in lists; India Water Portal copy of
        # the 777-page scan (cpheeo.gov.in timed out from here). No text layer: OCR'd (D-034).
        url: https://prod-qt-images.s3.amazonaws.com/indiawaterportal/import/sites/default/files/iwp2/manual_on_water_supply_and_treatment_cpheeo_moud_1999.pdf
        sha256: b8fd804559e896f66d22000d30afc4232cf4d25ea1013f2817453634a75b21e7
    ocr:                           # PDFs without a text layer (D-034); cached in <file>.ocr.jsonl
      min_text_share: 0.5          # OCR when fewer pages than this share have a text layer
      dpi: 200                     # render resolution (the 1999 scan is ~190 dpi)
      min_score: 0.5               # drop text boxes recognised with a lower score
      workers: 4                   # OCR processes (~0.5 GB each)
      threads_per_worker: 4        # ONNX Runtime threads per process
