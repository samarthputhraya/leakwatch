# Full-scale overlay, merged over default.yaml: LEAKWATCH_CONFIG=configs/full.yaml make <target>
# Use on a 16 GB machine with WSL memory raised (%UserProfile%\.wslconfig: memory=10GB).
# Full-scale simulation volume (100M+ readings, PRD §4.2) and GNN scenario counts (5,000) are
# added with Phases 4 and 5.

battledim:
  download_optional: true

sim:
  bench:
    repeats: 3
  scale:
    scenarios: 313                 # 313 x 7 days x 288 x 119 = 75.1M simulated readings
    workers: 6

dl:
  gnn_data:
    scenarios: 5000                # PRD §4.2 full scale

spark:
  master: local[*]
  driver_memory: 4g
  shuffle_partitions: 16

stream:
  raw:
    max_offsets_per_trigger: 1000000
